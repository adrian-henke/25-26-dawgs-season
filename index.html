<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26-27 Utah Dawgs Season</title>
<style>
  :root {
    color-scheme: dark;
    --blue:#184b9a; --blue-2:#2260c4; --blue-hi:#5b9bff;
    --bg:#05080f; --card:#0b1424; --card-2:#0f1b31; --hover:#15294d; --line:#1c2d4f;
    --ink:#f3f6fc; --muted:#94a6c6;
    --win:#22c55e; --loss:#f05252; --otl:#f59e0b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); min-height:100vh;
         background:radial-gradient(1100px 420px at 50% -120px, rgba(24,75,154,.38), transparent 70%), var(--bg); }

  /* Ticker */
  .ticker { background:#000; color:#fff; overflow-x:auto; white-space:nowrap; border-bottom:1px solid var(--line); scrollbar-width:thin; }
  .ticker-inner { display:inline-flex; padding:0 8px; }
  .tgame { display:inline-block; min-width:158px; padding:10px 16px; border-right:1px solid #111c33; font-size:.78rem; vertical-align:top; }
  .tgame .tdate { color:#7f93b8; font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .tgame .trow { display:flex; justify-content:space-between; gap:12px; font-weight:700; }
  .tgame .trow.dim { color:#8fa2c6; font-weight:500; }
  .tgame .tres { margin-top:4px; font-size:.66rem; font-weight:800; letter-spacing:.05em; }
  .tres.W { color:var(--win); } .tres.L { color:var(--loss); } .tres.OTL { color:var(--otl); } .tres.T { color:#9ca3af; } .tres.up { color:var(--blue-hi); }
  .tgame.upcoming .up-line { font-weight:700; margin:2px 0; }

  /* Header */
  header { background:#000; color:#fff; border-bottom:3px solid var(--blue); }
  .top { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:14px 20px; }
  .logo { height:64px; width:auto; max-width:130px; object-fit:contain; flex-shrink:0; }
  .crest { display:none; width:56px; height:56px; border-radius:50%; background:var(--blue); place-items:center; font-weight:800; letter-spacing:.02em; flex-shrink:0; }
  .brand { flex:1; }
  .brand h1 { font-size:1.35rem; font-weight:800; letter-spacing:.01em; }
  .brand p { font-size:.78rem; color:var(--muted); margin-top:2px; }
  .filter select { background:#000; color:#fff; border:1px solid var(--blue); border-radius:8px; padding:8px 10px; font-size:.82rem; font-weight:600; }
  nav { background:var(--blue); }
  .navin { max-width:1200px; margin:0 auto; display:flex; overflow-x:auto; padding:0 12px; }
  nav button { background:none; border:0; color:rgba(255,255,255,.72); font-size:.82rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
               padding:14px 18px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button:hover { color:#fff; }
  nav button.active { color:#fff; border-bottom-color:#fff; }

  /* Layout */
  main { max-width:1200px; margin:0 auto; padding:20px; }
  .view { display:none; } .view.active { display:block; }
  h2.sec { font-size:.82rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink); border-left:4px solid var(--blue-2); padding-left:10px; margin:28px 0 12px; }
  h2.sec:first-child { margin-top:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .toolbar input, .toolbar select { padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:.9rem; background:var(--card); color:var(--ink); }
  .toolbar input::placeholder { color:var(--muted); }
  .note { font-size:.8rem; color:var(--muted); margin:0 2px 10px; }
  .note.after { margin:8px 2px 0; }

  /* Key metrics: always a single row (scrolls sideways on small screens) */
  .stats { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:thin; }
  .stat { flex:1 1 0; min-width:108px; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--blue-2); border-radius:10px; padding:12px 10px; }
  .stat.wide { flex:1.5 1 0; min-width:132px; }
  .stat .lbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); white-space:nowrap; }
  .stat .val { font-size:1.35rem; font-weight:800; margin-top:4px; white-space:nowrap; }

  /* Leaders (every row uses the same font sizes) */
  .leaders { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
  .leader h3 { background:var(--blue); color:#fff; font-size:.76rem; text-transform:uppercase; letter-spacing:.1em; padding:10px 14px; }
  .lrow { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:.9rem; cursor:pointer; }
  .lrow:hover { background:var(--hover); }
  .lrow:last-child { border-bottom:0; }
  .lrow .rank { min-width:28px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
  .lrow .name { flex:1; font-weight:600; }
  .lrow .num { font-weight:800; font-variant-numeric:tabular-nums; }
  .lrow.first { background:rgba(24,75,154,.22); }
  .lrow.first:hover { background:var(--hover); }

  /* Tables */
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th { background:var(--blue); color:#fff; text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
       padding:11px 14px; cursor:pointer; white-space:nowrap; user-select:none; }
  th:hover { background:var(--blue-2); }
  th .arrow { margin-left:4px; opacity:.85; }
  th.num, td.num { text-align:right; }
  td { padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.txt { font-weight:600; }
  tbody tr:nth-child(even) { background:var(--card-2); }
  tbody tr:hover { background:var(--hover); }
  tr.click { cursor:pointer; }
  .badge { display:inline-block; min-width:36px; text-align:center; padding:2px 8px; border-radius:4px; font-size:.72rem; font-weight:800; color:#fff; }
  .badge.W { background:#16a34a; } .badge.L { background:#dc2626; } .badge.OTL { background:#d97706; } .badge.T { background:#6b7280; }
  .pos { color:var(--win); font-weight:700; } .neg { color:var(--loss); font-weight:700; }
  .msg { padding:36px 20px; text-align:center; color:var(--muted); }
  .err { color:var(--loss); }

  /* Stats page jump links */
  .jump { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .jump a { padding:6px 14px; border:1px solid var(--line); background:var(--card); border-radius:999px; font-size:.78rem; font-weight:700; text-decoration:none; color:var(--ink); }
  .jump a:hover { border-color:var(--blue-hi); color:var(--blue-hi); }

  /* Roster */
  .roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .pcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s; }
  .pcard:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(24,75,154,.45); border-color:var(--blue-2); }
  .pcard .hd { background:linear-gradient(135deg,#000 0%,var(--blue) 100%); color:#fff; padding:14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .pcard .jn { font-size:2.1rem; font-weight:800; line-height:1; }
  .pcard .pp { font-size:.7rem; font-weight:800; letter-spacing:.08em; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:999px; }
  .pcard .bd { padding:12px 14px; }
  .pcard .nm { font-weight:700; }
  .pcard .sub { font-size:.78rem; color:var(--muted); margin-top:2px; min-height:1em; }
  .pcard .mini { display:flex; gap:12px; margin-top:8px; font-size:.78rem; color:var(--muted); }
  .pcard .mini b { color:var(--ink); }

  /* Modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:flex-start; justify-content:center; padding:5vh 12px; overflow-y:auto; z-index:50; }
  .modal.open { display:flex; }
  .modal-card { background:var(--card); border:1px solid var(--line); border-radius:12px; width:100%; max-width:760px; position:relative; overflow:hidden; }
  .modal-card .close { position:absolute; top:10px; right:14px; background:none; border:0; color:#fff; font-size:1.8rem; cursor:pointer; line-height:1; }
  .mhead { background:linear-gradient(135deg,#000 0%,var(--blue) 100%); color:#fff; padding:20px; }
  .mhead .mj { font-size:.9rem; color:#a9c8ff; font-weight:700; }
  .mhead h2 { font-size:1.5rem; margin-top:2px; }
  .mtiles { display:flex; flex-wrap:wrap; gap:8px; padding:16px 20px 4px; }
  .mtile { flex:1; min-width:70px; background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .mtile .l { font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .mtile .v { font-size:1.3rem; font-weight:800; }
  .mlog { padding:8px 0 4px; }

  footer { text-align:center; color:var(--muted); font-size:.75rem; padding:30px 0 40px; }

  @media (max-width:600px) {
    main { padding:12px; }
    .top { padding:10px 12px; gap:10px; }
    .logo { height:48px; }
    .brand h1 { font-size:1.1rem; }
    td, th { padding:9px 10px; }
  }
</style>
</head>
<body>

<div class="ticker"><div class="ticker-inner" id="ticker"></div></div>

<header>
  <div class="top">
    <img id="logo" class="logo" alt="Utah Dawgs logo">
    <div class="crest" id="crest">UD</div>
    <div class="brand"><h1 id="teamName"></h1><p id="seasonLabel"></p></div>
    <div class="filter" id="filterWrap"><select id="typeFilter" title="Game type"></select></div>
  </div>
  <nav><div class="navin" id="nav"></div></nav>
</header>

<main>
  <div id="banner"></div>

  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="stats" id="stats"></div>
    <h2 class="sec">Next Up</h2>
    <div class="card"><div class="tablewrap" id="upcoming"></div></div>
    <h2 class="sec">Team Leaders</h2>
    <div class="leaders" id="leaders"></div>
    <h2 class="sec">Recent Results</h2>
    <div class="card"><div class="tablewrap" id="recent"></div></div>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="view-schedule"><div class="card"><div class="tablewrap" id="tbl-schedule"></div></div></section>

  <!-- STATS (skaters, goalies, penalties) -->
  <section class="view" id="view-stats">
    <div class="jump">
      <a href="#" data-jump="sec-skaters">Skaters</a>
      <a href="#" data-jump="sec-goalies">Goalies</a>
      <a href="#" data-jump="sec-penalties">Penalties</a>
    </div>

    <h2 class="sec" id="sec-skaters">Skaters</h2>
    <div class="toolbar"><input id="search-skaters" placeholder="Search players..."></div>
    <div class="card"><div class="tablewrap" id="tbl-skaters"></div></div>

    <h2 class="sec" id="sec-goalies">Goalies</h2>
    <div class="card"><div class="tablewrap" id="tbl-goalies"></div></div>
    <p class="note after" id="goalie-note"></p>

    <h2 class="sec" id="sec-penalties">Penalties</h2>
    <p class="note" id="pen-summary"></p>
    <div class="card"><div class="tablewrap" id="tbl-penalties"></div></div>
  </section>

  <!-- ROSTER -->
  <section class="view" id="view-roster">
    <div class="toolbar"><select id="pos-filter"></select></div>
    <div class="roster" id="roster"></div>
  </section>
</main>

<footer id="footer">Unofficial team stats site</footer>

<div class="modal" id="modal"><div class="modal-card"><button class="close" id="mclose">&times;</button><div id="mbody"></div></div></div>

<script>
/* =====================================================
   CONFIG
   ===================================================== */
const CFG = {
  teamName: "Utah Dawgs",
  crestText: "UD",
  season: "2026-27 Season",

  // Logo file: upload it to the same folder as index.html in your GitHub repo
  logo: "logo.png",

  sheetId: "1GAJflAWGoU1IDHfo6iZNgNLCzLzDGUVUpffetXVG71g",

  // Exact tab names (case-sensitive)
  tabs: { team:"Team Stats", skaters:"Skater Stats", penalties:"Penalty Stats", goalies:"Goalie Stats", roster:"Roster" },

  // Game length in minutes, used for goals-against average (two goalies x 19.5 = 39)
  gameMinutes: 39,

  refreshMinutes: 5
};

/* =====================================================
   HELPERS
   ===================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Reads numbers like 4, +4, -2, (2), and "−2" (typographic minus)
const num = v => {
  const s = String(v ?? "").trim().replace(/[\u2212\u2013\u2014]/g, "-");
  const n = parseFloat(s.replace(/[^0-9.\-]/g, ""));
  if (isNaN(n)) return 0;
  return /^\(.*\)$/.test(s) ? -Math.abs(n) : n;
};
const bool = v => String(v).trim().toUpperCase() === "TRUE";
const signed = n => n > 0 ? "+" + n : String(n);
const pm = n => `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${signed(n)}</span>`;
const pimFmt = v => +Number(v).toFixed(1);

const isBench = r => /bench/i.test(r.Player || "") || /bench/i.test(r.Jersey || "") || /bench/i.test(r.Position || "");
const isGoalie = p => /^g/i.test(String(p.Position || "").trim());
const handOf = p => p["Shoots/Catch"] ?? p.Shoots ?? "";
// Roster filter groups: G = Goalies, D = Defensemen, anything else with a position = Forwards
const groupOf = p => { const s = String(p.Position || "").trim(); return !s ? "" : /^g/i.test(s) ? "Goalies" : /^d/i.test(s) ? "Defensemen" : "Forwards"; };

function ts(d, t) {
  const m = String(d || "").match(/(\d+)\/(\d+)\/(\d+)/);
  if (!m) return 0;
  let h = 0, mi = 0;
  const tm = String(t || "").match(/(\d+):(\d+)\s*(AM|PM)?/i);
  if (tm) { h = (+tm[1]) % 12; if ((tm[3] || "").toUpperCase() === "PM") h += 12; mi = +tm[2]; }
  return new Date(+m[3], +m[1] - 1, +m[2], h, mi).getTime();
}
const shortDate = d => { const t = ts(d); return t ? new Date(t).toLocaleDateString("en-US", { month:"short", day:"numeric" }) : d; };

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function loadTab(name) {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(name);
  const rows = parseCSV(await res.text()).filter(r => r.some(c => c.trim() !== ""));
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? "").trim()])));
}

/* Sortable table. cols: {k, l, n (numeric), f (custom cell html)} */
function table(el, cols, rows, o = {}) {
  let sk = o.sort || null, asc = !!o.asc, view = [];
  const draw = () => {
    view = [...rows];
    const c = cols.find(c => c.k === sk);
    if (c) view.sort((a, b) => {
      let x = a[sk], y = b[sk];
      if (c.n) { x = +x || 0; y = +y || 0; } else { x = String(x ?? "").toLowerCase(); y = String(y ?? "").toLowerCase(); }
      return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
    });
    if (!view.length) { el.innerHTML = `<div class="msg">${o.empty || "No data yet."}</div>`; return; }
    el.innerHTML = `<table><thead><tr>${cols.map(c =>
      `<th data-k="${c.k}" class="${c.n ? "num" : ""}">${c.l}<span class="arrow">${c.k === sk ? (asc ? "▲" : "▼") : ""}</span></th>`).join("")}</tr></thead>
      <tbody>${view.map(r => `<tr${o.player && !r._bench ? ` class="click" data-player="${esc(r[o.player])}"` : ""}>${cols.map(c =>
        `<td class="${c.n ? "num" : "txt"}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    el.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k, cc = cols.find(c => c.k === k);
      if (sk === k) asc = !asc; else { sk = k; asc = !cc.n; }
      draw();
    });
  };
  draw();
  return { setRows(r) { rows = r; draw(); } };
}

/* =====================================================
   DATA
   ===================================================== */
const D = { team:[], skaters:[], penalties:[], goalies:[], roster:[] };
let typeFilter = "", posFilter = "", PM_KEY = "Plus/Minus";
let POS = new Map();
let skaterTable = null, skaterRows = [];

function detectColumns() {
  const k = Object.keys(D.skaters[0] || {}).find(k => /plus|\+\s*\/\s*-|±/i.test(k));
  if (k) PM_KEY = k;
}

function prepGames(rows) {
  return rows.map(g => {
    const r = String(g.Result || "").toUpperCase().trim();
    const ot = bool(g.OT) || bool(g.Shootout);
    let code = "";
    if (r) code = r.startsWith("W") ? "W" : r.startsWith("T") ? "T" : (r === "OTL" || r === "SOL") ? "OTL" : (ot ? "OTL" : "L");
    const suffix = bool(g.Shootout) ? " (SO)" : bool(g.OT) ? " (OT)" : "";
    return { ...g, _ts: ts(g.Date, g.Time), _gm: num(g.Game), _code: code, _played: code !== "", _suffix: suffix };
  }).sort((a, b) => a._ts - b._ts || a._gm - b._gm);
}
const inType = r => !typeFilter || r.Type === typeFilter;
const badge = g => g._played ? `<span class="badge ${g._code}">${g._code}${g._code === "W" ? esc(g._suffix) : ""}</span>` : "—";
const vs = g => (String(g["Home/Away"]).toLowerCase().startsWith("a") ? "@ " : "vs ") + esc(g.Opponent);

/* ----- Aggregations (every tab is summed per player) ----- */
function skaterAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const n = r.Player; if (!n) return;
    let a = m.get(n); if (!a) { a = { Player:n, Jersey:r.Jersey, GP:0, G:0, A:0, P:0, PM:0 }; m.set(n, a); }
    a.GP++; a.G += num(r.G); a.A += num(r.A);
    a.P += r.P !== "" ? num(r.P) : num(r.G) + num(r.A);
    a.PM += num(r[PM_KEY]);
    a.Jersey = r.Jersey || a.Jersey;
  });
  return [...m.values()].map(a => ({ ...a, PPG: a.GP ? +(a.P / a.GP).toFixed(2) : 0 }));
}

function goalieAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const n = r.Goalie; if (!n) return;
    let a = m.get(n); if (!a) { a = { Player:n, Jersey:r.Jersey, GP:0, W:0, L:0, T:0, OTL:0, GA:0, MIN:0, SO:0 }; m.set(n, a); }
    a.GP++; a.W += bool(r.W) ? 1 : 0; a.L += bool(r.L) ? 1 : 0; a.T += bool(r.T) ? 1 : 0; a.OTL += bool(r.OT) ? 1 : 0;
    a.GA += num(r.GA); a.MIN += num(r.Minutes); a.SO += bool(r.Shutout) ? 1 : 0;
    a.Jersey = r.Jersey || a.Jersey;
  });
  return [...m.values()].map(a => ({ ...a, GAA: a.MIN > 0 ? +(a.GA * CFG.gameMinutes / a.MIN).toFixed(2) : null, MIN: +a.MIN.toFixed(1) }));
}

function penaltyAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const bench = isBench(r);
    const n = bench ? "Bench" : (r.Player || "Unknown");
    let a = m.get(n); if (!a) { a = { Player:n, Jersey: bench ? "" : r.Jersey, _bench:bench, PEN:0, PIM:0, types:new Map() }; m.set(n, a); }
    a.PEN++; a.PIM += num(r.PIM);
    a.types.set(r.Penalty, (a.types.get(r.Penalty) || 0) + 1);
  });
  return [...m.values()].map(a => ({ ...a, PIM: pimFmt(a.PIM), Common: [...a.types.entries()].sort((x, y) => y[1] - x[1])[0]?.[0] || "" }));
}

/* =====================================================
   RENDER
   ===================================================== */
function renderTicker() {
  const played = D.team.filter(g => g._played).slice(-8);
  const upcoming = D.team.filter(g => !g._played).slice(0, 4);
  const res = played.map(g => `<div class="tgame">
      <div class="tdate">${esc(shortDate(g.Date))} &bull; Final${esc(g._suffix)}</div>
      <div class="trow"><span>${esc(CFG.teamName)}</span><span>${esc(g.GF)}</span></div>
      <div class="trow dim"><span>${vs(g)}</span><span>${esc(g.GA)}</span></div>
      <div class="tres ${g._code}">${g._code === "W" ? "WIN" : g._code === "L" ? "LOSS" : g._code}</div></div>`).join("");
  const up = upcoming.map((g, i) => `<div class="tgame upcoming${i === 0 ? " next" : ""}">
      <div class="tdate">${esc(shortDate(g.Date))} &bull; ${esc(g.Time)}</div>
      <div class="up-line">${esc(CFG.teamName)}</div>
      <div class="trow dim"><span>${vs(g)}</span></div>
      <div class="tres up">UPCOMING</div></div>`).join("");
  $("ticker").innerHTML = res + up || `<div class="tgame"><div class="tdate">No games yet</div></div>`;
  const nx = document.querySelector(".tgame.next");
  if (nx) $("ticker").parentElement.scrollLeft = Math.max(0, nx.offsetLeft - 330);
}

/* Leader card: ties share a rank (T-1, T-1, T-1, then 4), ties ordered by jersey number */
function leaderCard(title, rows, key, o = {}) {
  const fmt = o.fmt || (v => v);
  const pool = rows.filter(o.filter || (() => true));
  const dir = o.asc ? 1 : -1;
  pool.sort((a, b) => dir * (a[key] - b[key]) || num(a.Jersey) - num(b.Jersey));
  const ranked = pool.map(p => ({
    p,
    rank: pool.filter(q => o.asc ? q[key] < p[key] : q[key] > p[key]).length + 1,
    tied: pool.filter(q => q[key] === p[key]).length > 1
  })).filter(x => x.rank <= 5);
  return `<div class="card leader"><h3>${title}</h3>${ranked.length ? ranked.map(x =>
    `<div class="lrow${x.rank === 1 ? " first" : ""}" data-player="${esc(x.p.Player)}"><span class="rank">${x.tied ? "T-" : ""}${x.rank}</span><span class="name">${esc(x.p.Player)}</span><span class="num">${fmt(x.p[key])}</span></div>`).join("")
    : `<div class="msg">No data yet</div>`}</div>`;
}

function renderHome() {
  const games = D.team.filter(inType), done = games.filter(g => g._played);
  const w = done.filter(g => g._code === "W").length, l = done.filter(g => g._code === "L").length;
  const t = done.filter(g => g._code === "T").length, otl = done.filter(g => g._code === "OTL").length;
  const gf = done.reduce((s, g) => s + num(g.GF), 0), ga = done.reduce((s, g) => s + num(g.GA), 0), gp = done.length;
  // Team PIM = every row in Penalty Stats, including bench minors
  const pims = D.penalties.filter(inType).reduce((s, r) => s + num(r.PIM), 0);
  const tiles = [
    ["Record (W-L-T-OTL)", `${w}-${l}-${t}-${otl}`, true], ["Games Played", gp],
    ["Win %", gp ? Math.round((w / gp) * 100) + "%" : "—"],
    ["Goals For", gf], ["Goals Against", ga], ["Goal Diff", signed(gf - ga)],
    ["GF / Game", gp ? (gf / gp).toFixed(2) : "—"], ["GA / Game", gp ? (ga / gp).toFixed(2) : "—"],
    ["Penalty Min", pimFmt(pims)]
  ];
  $("stats").innerHTML = tiles.map(([a, b, wide]) => `<div class="stat${wide ? " wide" : ""}"><div class="lbl">${a}</div><div class="val">${b}</div></div>`).join("");

  // Next Up and Recent Results always show the actual next / last games
  table($("upcoming"), [
    { k:"Date", l:"Date", f:g => esc(shortDate(g.Date)) }, { k:"Time", l:"Time" },
    { k:"Opponent", l:"Opponent", f:g => vs(g) }, { k:"Rink", l:"Rink" }, { k:"Type", l:"Type" }
  ], D.team.filter(g => !g._played).slice(0, 3), { empty:"No upcoming games scheduled." });

  const sk = skaterAgg(D.skaters.filter(inType)), go = goalieAgg(D.goalies.filter(inType));
  $("leaders").innerHTML =
    leaderCard("Points", sk, "P", { filter:p => p.P > 0 }) +
    leaderCard("Goals", sk, "G", { filter:p => p.G > 0 }) +
    leaderCard("Assists", sk, "A", { filter:p => p.A > 0 }) +
    leaderCard("Points / Game", sk, "PPG", { filter:p => p.P > 0, fmt:v => v.toFixed(2) }) +
    leaderCard("Plus / Minus", sk, "PM", { fmt:signed }) +
    leaderCard("Goalie Wins", go, "W", { filter:g => g.W > 0 }) +
    leaderCard("Goals Against Avg", go, "GAA", { asc:true, filter:g => g.GAA !== null && g.MIN > 0, fmt:v => v.toFixed(2) });

  table($("recent"), scheduleCols(), D.team.filter(g => g._played).slice(-4).reverse(), { empty:"No games played yet." });
}

function scheduleCols() {
  return [
    { k:"_gm", l:"#", n:true, f:g => esc(g.Game) },
    { k:"_ts", l:"Date", n:true, f:g => esc(shortDate(g.Date)) },
    { k:"Time", l:"Time" },
    { k:"Opponent", l:"Opponent", f:g => vs(g) },
    { k:"Rink", l:"Rink" },
    { k:"GF", l:"Score", n:true, f:g => g._played ? `${esc(g.GF)} – ${esc(g.GA)}` : "—" },
    { k:"_code", l:"Result", f:g => badge(g) },
    { k:"Type", l:"Type" }
  ];
}

function renderSchedule() {
  table($("tbl-schedule"), scheduleCols(), D.team.filter(inType), { sort:"_ts", asc:true });
}

function renderSkaters() {
  skaterRows = skaterAgg(D.skaters.filter(inType)).map(r => ({ ...r, Pos: POS.get(r.Player) || "" }));
  const cols = [
    { k:"Player", l:"Player" },
    { k:"Jersey", l:"#", n:true }, { k:"Pos", l:"Pos" },
    { k:"GP", l:"GP", n:true }, { k:"G", l:"G", n:true }, { k:"A", l:"A", n:true },
    { k:"P", l:"P", n:true, f:r => `<b>${r.P}</b>` },
    { k:"PM", l:"+/-", n:true, f:r => pm(r.PM) },
    { k:"PPG", l:"P/GP", n:true, f:r => r.PPG.toFixed(2) }
  ];
  skaterTable = table($("tbl-skaters"), cols, skaterRows, { sort:"P", player:"Player" });
  $("search-skaters").oninput = applySkaterSearch;
  applySkaterSearch();
}
function applySkaterSearch() {
  const q = $("search-skaters").value.toLowerCase();
  skaterTable.setRows(skaterRows.filter(r => r.Player.toLowerCase().includes(q) || String(r.Jersey).includes(q)));
}

function renderGoalies() {
  const rows = goalieAgg(D.goalies.filter(inType));
  table($("tbl-goalies"), [
    { k:"Player", l:"Goalie" }, { k:"Jersey", l:"#", n:true }, { k:"GP", l:"GP", n:true },
    { k:"W", l:"W", n:true }, { k:"L", l:"L", n:true }, { k:"T", l:"T", n:true }, { k:"OTL", l:"OTL", n:true },
    { k:"GA", l:"GA", n:true }, { k:"MIN", l:"MIN", n:true },
    { k:"GAA", l:"GAA", n:true, f:r => r.GAA === null ? "—" : `<b>${r.GAA.toFixed(2)}</b>` },
    { k:"SO", l:"SO", n:true }
  ], rows, { sort:"W", player:"Player" });
  $("goalie-note").textContent = `GAA is goals against per ${CFG.gameMinutes} minutes (one full game).`;
}

function renderPenalties() {
  const raw = D.penalties.filter(inType);
  const rows = penaltyAgg(raw);
  const total = raw.reduce((s, r) => s + num(r.PIM), 0);
  const bench = raw.filter(isBench);
  const benchPIM = bench.reduce((s, r) => s + num(r.PIM), 0);
  $("pen-summary").textContent = raw.length
    ? `Team total: ${raw.length} penalties, ${pimFmt(total)} PIM (includes ${bench.length} bench ${bench.length === 1 ? "penalty" : "penalties"}, ${pimFmt(benchPIM)} PIM).`
    : "";
  table($("tbl-penalties"), [
    { k:"Player", l:"Player" },
    { k:"Jersey", l:"#", n:true, f:r => r._bench ? "—" : esc(r.Jersey) },
    { k:"PEN", l:"Penalties", n:true },
    { k:"PIM", l:"PIM", n:true, f:r => `<b>${r.PIM}</b>` },
    { k:"Common", l:"Most Common" }
  ], rows, { sort:"PIM", player:"Player", empty:"No penalties recorded." });
}

function renderRoster() {
  const players = D.roster.filter(p => !isBench(p));
  const groups = ["Forwards", "Defensemen", "Goalies"].filter(g => players.some(p => groupOf(p) === g));
  const sel = $("pos-filter");
  if (posFilter && !groups.includes(posFilter)) posFilter = "";
  sel.innerHTML = `<option value="">All players</option>` + groups.map(x => `<option value="${x}"${x === posFilter ? " selected" : ""}>${x}</option>`).join("");
  sel.style.display = groups.length > 1 ? "" : "none";

  // Roster stats are full-season totals (the game-type filter is hidden on this page)
  const sk = new Map(skaterAgg(D.skaters).map(a => [a.Player, a]));
  const go = new Map(goalieAgg(D.goalies).map(a => [a.Player, a]));
  const rows = players.filter(p => !posFilter || groupOf(p) === posFilter).sort((a, b) => num(a.Jersey) - num(b.Jersey));
  $("roster").innerHTML = rows.length ? rows.map(p => {
    const s = sk.get(p.Player), g = go.get(p.Player);
    const mini = s ? `<span>GP <b>${s.GP}</b></span><span>G <b>${s.G}</b></span><span>A <b>${s.A}</b></span><span>P <b>${s.P}</b></span>`
               : g ? `<span>GP <b>${g.GP}</b></span><span>W <b>${g.W}</b></span><span>GAA <b>${g.GAA === null ? "—" : g.GAA.toFixed(2)}</b></span>` : "";
    const hand = handOf(p);
    const handLine = hand ? `${isGoalie(p) ? "Catches" : "Shoots"} ${esc(hand)}` : "&nbsp;";
    return `<div class="pcard" data-player="${esc(p.Player)}">
      <div class="hd"><div class="jn">${esc(p.Jersey || "#")}</div>${p.Position ? `<div class="pp">${esc(p.Position)}</div>` : ""}</div>
      <div class="bd"><div class="nm">${esc(p.Player)}</div><div class="sub">${handLine}</div><div class="mini">${mini}</div></div></div>`;
  }).join("") : `<div class="msg">Roster not available.</div>`;
}

/* ----- Player modal ----- */
function miniTable(headers, rows) {
  return `<div class="tablewrap"><table><thead><tr>${headers.map(h => `<th style="cursor:default">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function openPlayer(name) {
  const ro = D.roster.find(r => r.Player === name);
  const srows = D.skaters.filter(r => r.Player === name).sort((a, b) => ts(a.Date) - ts(b.Date));
  const grows = D.goalies.filter(r => r.Goalie === name).sort((a, b) => ts(a.Date) - ts(b.Date));
  const jersey = ro?.Jersey || srows[0]?.Jersey || grows[0]?.Jersey || "";
  let tiles = "", log = "";
  const tile = (l, v) => `<div class="mtile"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  if (srows.length) {
    const a = skaterAgg(srows)[0];
    tiles = tile("GP", a.GP) + tile("G", a.G) + tile("A", a.A) + tile("P", a.P) + tile("+/-", signed(a.PM)) + tile("P/GP", a.PPG.toFixed(2));
    log = miniTable(["Gm", "Date", "Opponent", "G", "A", "P", "+/-"],
      srows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), esc(r.G), esc(r.A), esc(r.P), pm(num(r[PM_KEY]))]));
  } else if (grows.length) {
    const a = goalieAgg(grows)[0];
    tiles = tile("GP", a.GP) + tile("W", a.W) + tile("L", a.L) + tile("GA", a.GA) + tile("GAA", a.GAA === null ? "—" : a.GAA.toFixed(2)) + tile("SO", a.SO);
    log = miniTable(["Gm", "Date", "Opponent", "Dec.", "GA", "MIN"],
      grows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), bool(r.W) ? "W" : bool(r.L) ? "L" : bool(r.T) ? "T" : bool(r.OT) ? "OTL" : "—", esc(r.GA), esc(r.Minutes)]));
  } else tiles = `<div class="msg" style="width:100%">No game stats yet.</div>`;
  const pens = D.penalties.filter(r => r.Player === name);
  const penLine = pens.length ? `<p class="note" style="padding:8px 20px 0">Penalties: ${pens.length} for ${pimFmt(pens.reduce((s, r) => s + num(r.PIM), 0))} PIM</p>` : "";
  const sub = [jersey, ro?.Position, handOf(ro || {}) ? `${ro && isGoalie(ro) ? "Catches" : "Shoots"} ${handOf(ro)}` : ""].filter(Boolean).map(esc).join(" &bull; ");
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${sub}</div><h2>${esc(name)}</h2></div>
    <div class="mtiles">${tiles}</div>${penLine}<div class="mlog">${log}</div>`;
  $("modal").classList.add("open");
}
const closeModal = () => $("modal").classList.remove("open");

/* =====================================================
   NAV / INIT
   ===================================================== */
function buildNav() {
  const items = [["home","Home"],["schedule","Schedule"],["stats","Stats"],["roster","Roster"]];
  $("nav").innerHTML = items.map(([id, l]) => `<button data-v="${id}">${l}</button>`).join("");
  const show = id => {
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + id));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.v === id));
    $("filterWrap").style.display = id === "roster" ? "none" : "";   // game-type filter hidden on Roster
    history.replaceState(null, "", "#" + id);
    window.scrollTo(0, 0);
  };
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
  const start = location.hash.slice(1);
  show(items.some(i => i[0] === start) ? start : "home");
}

function renderAll() {
  POS = new Map(D.roster.filter(p => !isBench(p)).map(p => [p.Player, p.Position || ""]));
  renderTicker(); renderHome(); renderSchedule(); renderSkaters(); renderGoalies(); renderPenalties(); renderRoster();
}

function buildTypeFilter() {
  const types = [...new Set(D.team.map(g => g.Type).filter(Boolean))];
  const sel = $("typeFilter");
  sel.innerHTML = `<option value="">All games</option>` + types.map(t => `<option value="${esc(t)}"${t === typeFilter ? " selected" : ""}>${esc(t)}</option>`).join("");
  sel.style.display = types.length > 1 ? "" : "none";
}

async function loadAll() {
  const keys = Object.keys(CFG.tabs);
  const results = await Promise.allSettled(keys.map(k => loadTab(CFG.tabs[k])));
  const failed = [];
  results.forEach((r, i) => { if (r.status === "fulfilled") D[keys[i]] = r.value; else failed.push(CFG.tabs[keys[i]]); });
  D.team = prepGames(D.team);
  detectColumns();
  $("banner").innerHTML = failed.length
    ? `<div class="card" style="margin-bottom:14px"><div class="msg err">Couldn't load: ${failed.map(esc).join(", ")}. Check the tab names and that the sheet is shared as "Anyone with the link can view".</div></div>` : "";
  buildTypeFilter();
  renderAll();
  $("footer").textContent = `Unofficial team stats site • Data from Google Sheets • Updated ${new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}`;
}

/* Logo (falls back to the "UD" circle if the image isn't found) + favicon */
const logoEl = $("logo");
logoEl.onerror = () => { logoEl.style.display = "none"; $("crest").style.display = "grid"; };
logoEl.src = CFG.logo;
const fav = document.createElement("link"); fav.rel = "icon"; fav.href = CFG.logo; document.head.appendChild(fav);

$("teamName").textContent = CFG.teamName;
$("crest").textContent = CFG.crestText;
$("seasonLabel").textContent = CFG.season;
$("typeFilter").onchange = e => { typeFilter = e.target.value; renderAll(); };
$("pos-filter").onchange = e => { posFilter = e.target.value; renderRoster(); };
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); $(j.dataset.jump).scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  const p = e.target.closest("[data-player]");
  if (p && p.dataset.player) openPlayer(p.dataset.player);
});
$("mclose").onclick = closeModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

buildNav();
loadAll();
setInterval(loadAll, CFG.refreshMinutes * 60000);
</script>
</body>
